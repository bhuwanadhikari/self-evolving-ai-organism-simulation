# Baseline / Environment 1: abundant resources. Purpose: validate the system.
name: baseline
seed: 42
ticks: 500
description: "Env 1 - abundant resources, asexual reproduction, mutation on, rule brain"
hypothesis: "With abundant food the population grows to the compute cap; selection pressure is weak, so trait means drift little."
population:
  initial_size: 20
  max_population: 200
world: {width: 20, height: 20}
resources:
  initial_count: 400
  regeneration_rate: 0.05
  max_per_cell: 5
  energy_per_unit: 10
organism:
  initial_energy: 100
  metabolic_cost: 1.0
  move_cost: 1.0
  max_age: 400
reproduction: {enabled: true, mode: asexual, cost: 60, offspring_energy: 40, min_energy: 80}
evolution: {mutation_enabled: true, mutation_rate: 0.02, mutation_strength: 0.1}
memory: {short_term_capacity: 10, long_term_capacity: 20, inheritance_mode: none}
brain: {type: rule}
